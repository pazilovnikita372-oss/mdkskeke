name: Build ODcheat APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Repository root: $GITHUB_WORKSPACE"
          test -f settings.gradle.kts || {
            echo "::error::В корне репозитория нет settings.gradle.kts."
            echo "Загрузите ВСЁ содержимое этого ZIP в корень репозитория: app/, gradle/, build.gradle.kts, settings.gradle.kts, gradle.properties."
            echo "Не загружайте только папку .github."
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          }
          test -d app || { echo "::error::Не найдена папка app/"; exit 1; }
          test -f build.gradle.kts || { echo "::error::Не найден build.gradle.kts"; exit 1; }
          test -f gradle/libs.versions.toml || { echo "::error::Не найден gradle/libs.versions.toml"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ODcheat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
